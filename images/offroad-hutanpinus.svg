<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90C4"/>
      <stop offset="100%" stop-color="#7DB8A5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyO)"/>
  <!-- Mountains -->
  <path d="M0,220 L120,130 L250,200 L380,100 L530,180 L680,120 L800,170 L800,500 L0,500Z" fill="#2A5235"/>
  <!-- Pine trees background -->
  <g fill="#1E4733">
    <polygon points="50,210 75,120 100,210"/>
    <polygon points="130,200 160,100 190,200"/>
    <polygon points="250,190 280,90 310,190"/>
    <polygon points="380,200 410,100 440,200"/>
    <polygon points="500,195 530,95 560,195"/>
    <polygon points="620,205 650,110 680,205"/>
    <polygon points="720,200 750,105 780,200"/>
  </g>
  <!-- Forest floor -->
  <path d="M0,300 Q200,280 400,300 Q600,320 800,290 L800,500 L0,500Z" fill="#1A4331"/>
  <!-- Dirt trail -->
  <path d="M100,500 Q200,400 300,380 Q450,360 550,370 Q650,380 800,350" stroke="#8B6914" stroke-width="30" fill="none" opacity="0.4"/>
  <path d="M100,500 Q200,400 300,380 Q450,360 550,370 Q650,380 800,350" stroke="#A0845C" stroke-width="15" fill="none" opacity="0.3"/>
  <!-- Jeep -->
  <g transform="translate(380,340)">
    <!-- Body -->
    <rect x="-40" y="-30" width="80" height="35" rx="5" fill="#D97757"/>
    <rect x="-35" y="-50" width="55" height="25" rx="3" fill="#D97757"/>
    <!-- Windows -->
    <rect x="-30" y="-47" width="20" height="18" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="-5" y="-47" width="20" height="18" rx="2" fill="#87CEEB" opacity="0.7"/>
    <!-- Headlights -->
    <circle cx="-38" cy="-15" r="4" fill="#FFE4B5"/>
    <circle cx="38" cy="-15" r="4" fill="#FFE4B5"/>
    <!-- Wheels -->
    <circle cx="-25" cy="8" r="12" fill="#333"/>
    <circle cx="-25" cy="8" r="7" fill="#666"/>
    <circle cx="25" cy="8" r="12" fill="#333"/>
    <circle cx="25" cy="8" r="7" fill="#666"/>
    <!-- Roof rack -->
    <line x1="-35" y1="-52" x2="20" y2="-52" stroke="#8B6914" stroke-width="3"/>
    <!-- Driver silhouette -->
    <circle cx="-20" cy="-42" r="6" fill="#FFD6A5" opacity="0.7"/>
    <circle cx="5" cy="-42" r="6" fill="#E8C9A0" opacity="0.7"/>
  </g>
  <!-- Dust cloud -->
  <g fill="rgba(160,132,92,0.3)">
    <circle cx="310" cy="360" r="15"/>
    <circle cx="295" cy="355" r="12"/>
    <circle cx="280" cy="365" r="10"/>
    <circle cx="320" cy="370" r="8"/>
  </g>
  <!-- Pine trees foreground -->
  <g fill="#15372A">
    <polygon points="30,310 55,220 80,310"/>
    <polygon points="700,290 730,190 760,290"/>
  </g>
  <!-- Sun -->
  <circle cx="680" cy="60" r="30" fill="#FFE4B5" opacity="0.6"/>
</svg>
