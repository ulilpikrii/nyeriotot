<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA3D9"/>
      <stop offset="100%" stop-color="#82C4A5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyW)"/>
  <!-- Mountains -->
  <path d="M0,220 L100,140 L230,200 L370,110 L520,180 L660,120 L800,170 L800,500 L0,500Z" fill="#2A5235"/>
  <!-- Trees -->
  <g fill="#1E4733">
    <polygon points="30,220 55,140 80,220"/>
    <polygon points="680,210 705,130 730,210"/>
    <polygon points="740,220 760,150 780,220"/>
  </g>
  <!-- Ground -->
  <path d="M0,330 Q200,310 400,325 Q600,340 800,315 L800,500 L0,500Z" fill="#1A4331"/>
  <!-- Hotel Building -->
  <g transform="translate(200,160)">
    <!-- Main hotel -->
    <rect x="0" y="0" width="250" height="180" rx="5" fill="#3D6B4E"/>
    <!-- Roof -->
    <path d="M-10,0 L125,-50 L260,0Z" fill="#2A5235"/>
    <!-- Roof ornament -->
    <rect x="110" y="-55" width="30" height="10" rx="3" fill="#D97757"/>
    <!-- Floors: windows -->
    <!-- Floor 3 -->
    <rect x="20" y="15" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="60" y="15" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="100" y="15" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="140" y="15" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="180" y="15" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <!-- Floor 2 -->
    <rect x="20" y="50" width="28" height="22" rx="2" fill="#FFE4B5" opacity="0.6"/>
    <rect x="60" y="50" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="100" y="50" width="28" height="22" rx="2" fill="#FFE4B5" opacity="0.6"/>
    <rect x="140" y="50" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="180" y="50" width="28" height="22" rx="2" fill="#FFE4B5" opacity="0.6"/>
    <!-- Floor 1 -->
    <rect x="20" y="85" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="60" y="85" width="28" height="22" rx="2" fill="#FFE4B5" opacity="0.6"/>
    <rect x="100" y="85" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <rect x="140" y="85" width="28" height="22" rx="2" fill="#FFE4B5" opacity="0.6"/>
    <rect x="180" y="85" width="28" height="22" rx="2" fill="#87CEEB" opacity="0.7"/>
    <!-- Main entrance -->
    <rect x="95" y="120" width="60" height="60" rx="5" fill="#23503D"/>
    <rect x="100" y="125" width="50" height="50" rx="3" fill="#2E6E4E"/>
    <!-- Awning -->
    <path d="M80,120 L125,105 L170,120Z" fill="#D97757"/>
    <!-- Hotel name -->
    <rect x="60" y="-5" width="130" height="18" rx="4" fill="#D97757"/>
    <text x="125" y="9" font-family="sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">HOTEL WONDERLAND</text>
    <!-- Balconies -->
    <line x1="15" y1="45" x2="215" y2="45" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="15" y1="80" x2="215" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="15" y1="115" x2="215" y2="115" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  <!-- Pool area -->
  <ellipse cx="530" cy="370" rx="80" ry="30" fill="#2E86AB" opacity="0.7"/>
  <ellipse cx="530" cy="370" rx="75" ry="27" fill="#3498DB" opacity="0.5"/>
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none">
    <ellipse cx="520" cy="365" rx="20" ry="8"/>
    <ellipse cx="545" cy="375" rx="15" ry="6"/>
  </g>
  <!-- Garden decorations -->
  <g fill="#2A5235">
    <circle cx="500" cy="340" r="12"/>
    <circle cx="560" cy="345" r="10"/>
    <circle cx="480" cy="350" r="8"/>
    <circle cx="580" cy="355" r="9"/>
  </g>
  <!-- Pathway -->
  <path d="M450,340 Q460,380 530,400 Q600,420 650,430" stroke="#A0845C" stroke-width="8" fill="none" opacity="0.4"/>
  <!-- People near pool -->
  <g transform="translate(510,355)">
    <circle cx="0" cy="-8" r="5" fill="#FFD6A5"/>
    <rect x="-4" y="-3" width="8" height="10" rx="2" fill="#FF6933"/>
    <circle cx="20" cy="-8" r="5" fill="#E8C9A0"/>
    <rect x="16" y="-3" width="8" height="10" rx="2" fill="#3B82F6"/>
  </g>
  <!-- Sun -->
  <circle cx="700" cy="50" r="30" fill="#FFE4B5" opacity="0.6"/>
  <!-- Clouds -->
  <g fill="rgba(255,255,255,0.3)">
    <ellipse cx="150" cy="60" rx="40" ry="15"/>
    <ellipse cx="180" cy="55" rx="30" ry="12"/>
    <ellipse cx="550" cy="40" rx="35" ry="12"/>
    <ellipse cx="580" cy="35" rx="25" ry="10"/>
  </g>
</svg>
