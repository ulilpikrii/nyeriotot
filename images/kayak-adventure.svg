<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="skyK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90C4"/>
      <stop offset="100%" stop-color="#7DB8A5"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E86AB"/>
      <stop offset="100%" stop-color="#1B5E7F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#skyK)"/>
  <!-- Mountains -->
  <path d="M0,200 L60,120 L120,170 L200,90 L280,150 L350,100 L400,130 L400,300 L0,300Z" fill="#2A5235"/>
  <!-- Trees along riverbank -->
  <g fill="#1A4331">
    <polygon points="20,200 35,140 50,200"/>
    <polygon points="60,195 78,130 96,195"/>
    <polygon points="300,190 318,125 336,190"/>
    <polygon points="340,195 360,135 380,195"/>
  </g>
  <!-- River -->
  <path d="M0,260 Q100,240 200,260 Q300,280 400,250 L400,500 L0,500Z" fill="url(#water)"/>
  <!-- Water ripples -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none">
    <path d="M30,300 Q60,295 90,300"/>
    <path d="M120,310 Q150,305 180,310"/>
    <path d="M220,320 Q250,315 280,320"/>
    <path d="M300,305 Q330,300 360,305"/>
    <path d="M50,340 Q80,335 110,340"/>
    <path d="M200,350 Q230,345 260,350"/>
    <path d="M100,380 Q130,375 160,380"/>
    <path d="M250,390 Q280,385 310,390"/>
  </g>
  <!-- Raft -->
  <g transform="translate(150,280)">
    <!-- Raft body -->
    <ellipse cx="50" cy="20" rx="60" ry="15" fill="#E87040"/>
    <ellipse cx="50" cy="20" rx="55" ry="10" fill="#D4603A"/>
    <!-- Person 1 -->
    <circle cx="25" cy="-5" r="8" fill="#FFD6A5"/>
    <rect x="19" y="2" width="12" height="15" rx="2" fill="#FF6933"/>
    <ellipse cx="25" cy="-10" rx="9" ry="5" fill="#E85D3A"/>
    <!-- Paddle 1 -->
    <line x1="10" y1="-5" x2="-15" y2="25" stroke="#8B6914" stroke-width="2.5"/>
    <ellipse cx="-17" cy="27" rx="5" ry="10" fill="#8B6914" transform="rotate(-25,-17,27)"/>
    <!-- Person 2 -->
    <circle cx="75" cy="-5" r="8" fill="#E8C9A0"/>
    <rect x="69" y="2" width="12" height="15" rx="2" fill="#3B82F6"/>
    <ellipse cx="75" cy="-10" rx="9" ry="5" fill="#2D5A3D"/>
    <!-- Paddle 2 -->
    <line x1="90" y1="-5" x2="115" y2="25" stroke="#8B6914" stroke-width="2.5"/>
    <ellipse cx="117" cy="27" rx="5" ry="10" fill="#8B6914" transform="rotate(25,117,27)"/>
  </g>
  <!-- Splash effects -->
  <g fill="rgba(255,255,255,0.5)">
    <circle cx="130" cy="295" r="3"/>
    <circle cx="125" cy="290" r="2"/>
    <circle cx="270" cy="290" r="3"/>
    <circle cx="275" cy="285" r="2"/>
  </g>
  <!-- Sun -->
  <circle cx="350" cy="50" r="25" fill="#FFE4B5" opacity="0.7"/>
</svg>
