<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA3D9"/>
      <stop offset="100%" stop-color="#8BC5A0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyP)"/>
  <!-- Mountains -->
  <path d="M0,250 L100,160 L200,220 L350,120 L500,200 L650,140 L800,180 L800,500 L0,500Z" fill="#2A5235"/>
  <!-- Forest -->
  <path d="M0,300 Q200,270 400,290 Q600,310 800,280 L800,500 L0,500Z" fill="#1A4331"/>
  <!-- Ground -->
  <path d="M0,380 Q200,370 400,380 Q600,390 800,375 L800,500 L0,500Z" fill="#15372A"/>
  <!-- Photographer -->
  <g transform="translate(350,310)">
    <!-- Body -->
    <circle cx="0" cy="-35" r="15" fill="#FFD6A5"/>
    <rect x="-14" y="-20" width="28" height="40" rx="5" fill="#2D5A3D"/>
    <rect x="-8" y="20" width="7" height="30" fill="#3D3126"/>
    <rect x="1" y="20" width="7" height="30" fill="#3D3126"/>
    <!-- Camera -->
    <rect x="12" y="-15" width="25" height="18" rx="3" fill="#333"/>
    <circle cx="24" cy="-6" r="6" fill="#555"/>
    <circle cx="24" cy="-6" r="3" fill="#87CEEB"/>
    <rect x="15" y="-18" width="8" height="4" rx="1" fill="#444"/>
    <!-- Hat -->
    <ellipse cx="0" cy="-42" rx="18" ry="6" fill="#D97757"/>
    <rect x="-12" y="-48" width="24" height="8" rx="4" fill="#D97757"/>
  </g>
  <!-- Group being photographed -->
  <g transform="translate(550,330)">
    <circle cx="0" cy="-25" r="10" fill="#FFD6A5"/>
    <rect x="-8" y="-15" width="16" height="25" rx="3" fill="#FF6933"/>
    <circle cx="30" cy="-25" r="10" fill="#E8C9A0"/>
    <rect x="22" y="-15" width="16" height="25" rx="3" fill="#3B82F6"/>
    <circle cx="60" cy="-25" r="10" fill="#FFD6A5"/>
    <rect x="52" y="-15" width="16" height="25" rx="3" fill="#FFA500"/>
    <circle cx="-30" cy="-25" r="10" fill="#E8C9A0"/>
    <rect x="-38" y="-15" width="16" height="25" rx="3" fill="#4CAF50"/>
  </g>
  <!-- Camera flash lines -->
  <g stroke="#FFE4B5" stroke-width="2" opacity="0.6">
    <line x1="390" y1="300" x2="420" y2="285"/>
    <line x1="390" y1="295" x2="425" y2="295"/>
    <line x1="390" y1="305" x2="420" y2="310"/>
  </g>
  <!-- Sun -->
  <circle cx="700" cy="60" r="35" fill="#FFE4B5" opacity="0.6"/>
  <!-- Drone -->
  <g transform="translate(250,100)">
    <rect x="-10" y="-5" width="20" height="10" rx="3" fill="#555"/>
    <line x1="-15" y1="-5" x2="-25" y2="-10" stroke="#777" stroke-width="2"/>
    <line x1="15" y1="-5" x2="25" y2="-10" stroke="#777" stroke-width="2"/>
    <circle cx="-25" cy="-10" r="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="25" cy="-10" r="8" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="3" fill="#87CEEB"/>
  </g>
</svg>
