<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="skyH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BAED6"/>
      <stop offset="100%" stop-color="#A8D5BA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#skyH)"/>
  <!-- Mountains -->
  <path d="M0,250 L80,150 L160,220 L240,130 L320,190 L400,140 L400,500 L0,500Z" fill="#3D6B4E"/>
  <!-- Trees -->
  <g fill="#2A5235">
    <polygon points="50,240 70,170 90,240"/>
    <polygon points="120,230 140,160 160,230"/>
    <polygon points="200,220 225,140 250,220"/>
    <polygon points="280,235 305,155 330,235"/>
    <polygon points="350,240 370,170 390,240"/>
  </g>
  <!-- Forest floor -->
  <path d="M0,300 Q100,280 200,300 Q300,320 400,290 L400,500 L0,500Z" fill="#1A4331"/>
  <!-- Trail path -->
  <path d="M180,500 Q190,400 200,350 Q220,300 250,280 Q290,260 320,240" stroke="#C4A882" stroke-width="5" fill="none" stroke-dasharray="8,5" opacity="0.6"/>
  <!-- Hiker 1 -->
  <g transform="translate(210,290)">
    <circle cx="0" cy="-25" r="10" fill="#FFD6A5"/>
    <rect x="-8" y="-15" width="16" height="25" rx="3" fill="#E85D3A"/>
    <rect x="-5" y="10" width="4" height="20" fill="#4A3728"/>
    <rect x="1" y="10" width="4" height="20" fill="#4A3728"/>
    <rect x="-12" y="-30" width="24" height="6" rx="3" fill="#2D5A3D"/>
    <!-- Backpack -->
    <rect x="5" y="-12" width="10" height="18" rx="3" fill="#D97757" opacity="0.8"/>
  </g>
  <!-- Hiker 2 -->
  <g transform="translate(250,270)">
    <circle cx="0" cy="-25" r="10" fill="#E8C9A0"/>
    <rect x="-8" y="-15" width="16" height="25" rx="3" fill="#3B82F6"/>
    <rect x="-5" y="10" width="4" height="20" fill="#3D3126"/>
    <rect x="1" y="10" width="4" height="20" fill="#3D3126"/>
    <rect x="-12" y="-30" width="24" height="6" rx="3" fill="#1A4331"/>
    <rect x="5" y="-12" width="10" height="18" rx="3" fill="#FF6933" opacity="0.8"/>
  </g>
  <!-- Hiker 3 -->
  <g transform="translate(170,310)">
    <circle cx="0" cy="-25" r="10" fill="#FFD6A5"/>
    <rect x="-8" y="-15" width="16" height="25" rx="3" fill="#FFA500"/>
    <rect x="-5" y="10" width="4" height="20" fill="#4A3728"/>
    <rect x="1" y="10" width="4" height="20" fill="#4A3728"/>
    <rect x="-12" y="-30" width="24" height="6" rx="3" fill="#E85D3A"/>
    <rect x="5" y="-12" width="10" height="18" rx="3" fill="#23503D" opacity="0.8"/>
  </g>
  <!-- Sun rays -->
  <circle cx="350" cy="60" r="30" fill="#FFE4B5" opacity="0.6"/>
  <circle cx="350" cy="60" r="50" fill="#FFE4B5" opacity="0.2"/>
</svg>
